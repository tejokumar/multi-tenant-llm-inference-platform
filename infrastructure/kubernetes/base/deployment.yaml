apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3
  namespace: inference-system
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: model-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: model-worker
      annotations:
        autopilot.gke.io/primary-container: vllm
    spec:
      enableServiceLinks: false
      nodeSelector:
        cloud.google.com/compute-class: l4-medium-us-east1-c
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.26.0@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
          args:
            - Qwen/Qwen3-1.7B
            - --served-model-name=qwen3-1.7b
            - --dtype=bfloat16
            - --max-model-len=8192
            - --gpu-memory-utilization=0.85
            - --generation-config=vllm
          env:
            - name: HF_HOME
              value: /home/vllm/.cache/huggingface
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              ephemeral-storage: 20Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /home/vllm/.cache/huggingface
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
