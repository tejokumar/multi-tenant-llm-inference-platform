apiVersion: v1
kind: Pod
metadata:
  name: missing-gpu-check
  namespace: inference-system
  labels:
    app.kubernetes.io/name: missing-gpu-check
spec:
  restartPolicy: Never
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
  containers:
    - name: check
      image: vllm/vllm-openai:v0.26.0@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
      command:
        - python3
        - -c
        - |
          import torch

          visible = torch.cuda.is_available()
          print(f"cuda_available={visible}")
          assert visible, "CUDA device is not visible; request nvidia.com/gpu"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
          ephemeral-storage: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
          ephemeral-storage: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
